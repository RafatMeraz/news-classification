stages:
  s3_manifest:
    cmd: python -m pipeline.s3_manifest
    always_changed: true
    deps:
      - pipeline/s3_manifest.py
    params:
      - data_ingestion.bucket_name
    outs:
      - data/s3_manifest.json
  data_ingestion:
    cmd: python -m pipeline.data_ingestion
    deps:
      - pipeline/data_ingestion.py
      - data/s3_manifest.json
    outs:
      - data/raw
    params:
      - data_ingestion.bucket_name
  data_preprocessing:
    cmd: python -m pipeline.data_preprocessing
    deps:
      - data/raw
      - pipeline/data_preprocessing.py
    outs:
      - data/processed
  feature_engineering:
    cmd: python -m pipeline.feature_engineering
    deps:
      - data/processed
      - pipeline/feature_engineering.py
    outs:
      - data/encoded
  data_splitting:
    cmd: python -m pipeline.data_splitting
    deps:
      - data/encoded
      - pipeline/data_splitting.py
    params:
      - split.test_size
      - split.random_state
    outs:
      - data/split
  model_training:
    cmd: python -m pipeline.model_training
    deps:
      - data/split
      - pipeline/model_training.py
    params:
      - model_train.cv
      - model_train.scoring
      - model_train.n_jobs
    outs:
      - models/
  model_evaluation:
    cmd: python -m pipeline.model_evaluation
    deps:
      - data/split
      - models/run_id.txt
      - models/svc_model.pkl
      - pipeline/model_evaluation.py