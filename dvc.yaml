stages:
  data_ingestion:
    cmd: python -m pipeline.data_ingestion
    deps:
      - pipeline/data_ingestion.py
    outs:
      - data/raw
  data_preprocessing:
    cmd: python -m pipeline.data_preprocessing
    deps:
      - data/raw
      - pipeline/data_preprocessing.py
    outs:
      - data/processed
  feature_engineering:
    cmd: python -m pipeline.feature_engineering
    deps:
      - data/processed
      - pipeline/feature_engineering.py
    outs:
      - data/encoded
  model_training:
    cmd: python -m pipeline.model_training
    deps:
      - data/encoded
      - pipeline/model_training.py
    outs:
      - models/