[project]
name = "news-classification"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "RafatMeraz", email = "razhossain201@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "awscli>=1.46.3",
    "boto3>=1.44.3",
    "dvc>=3.67.1",
    "ipykernel>=7.4.0",
    "mlflow>=3.18.0",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
news-classification = "news_classification:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
